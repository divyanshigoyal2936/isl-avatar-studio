services:
  - type: web
    name: isl-avatar-studio
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STT_PROVIDER
        value: fallback
      - key: DEBUG
        value: "false"
